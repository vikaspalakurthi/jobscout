name: Company board request
description: A company whose careers board JobScout should fetch directly
labels: [board]
body:
  - type: input
    id: company
    attributes:
      label: Company
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Careers page URL
    validations: { required: true }
  - type: textarea
    id: detect
    attributes:
      label: detect.py output
      description: "Paste the output of `python detect.py \"Company\"` and/or `python detect.py --url <careers page> \"Company\"` if you ran it."
      render: text
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: The board is a public page or API with no login wall or bot protection (category 1 or 2 in docs/ARCHITECTURE.md).
          required: true
