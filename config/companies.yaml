# Companies whose public ATS job boards get fetched directly (best-quality source:
# full descriptions, direct apply links, no key needed).
#
#   ats:  greenhouse | lever | ashby | smartrecruiters
#   slug: the company's board identifier in that ATS
#
# To add a company: open its careers page, click a job, and look at the URL —
#   boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>  -> greenhouse
#   jobs.lever.co/<slug>                                            -> lever
#   jobs.ashbyhq.com/<slug>                                         -> ashby
#   careers.smartrecruiters.com/<slug>                              -> smartrecruiters
# Slugs that fail show up in the refresh report in the dashboard.

