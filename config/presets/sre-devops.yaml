# Role preset: SRE / DevOps / Platform / Observability (the original JobScout profile).
# Settings -> Role preset -> Load copies this file over config/skills.yaml (after a backup).
# Edit config/skills.yaml freely afterwards; presets are starting points, not live config.

preset:
  name: SRE / DevOps / Platform
  description: Site reliability, DevOps, platform, infrastructure, observability, Kafka/Elastic platform administration.

# What is fetched at all. Boards return hundreds of postings; only titles matching one of
# these patterns (or descriptions passing the rescue rule) are stored. Regexes, case-insensitive.
relevance:
  title_terms:
    - site reliab|\bsre\b|dev.?ops|observab|platform|infrastructur|\binfra\b|kafka|elastic
    - opensearch|\belk\b|splunk|\bsiem\b|reliab|production engineer|cloud engineer
    - cloud operations|cloud infrastructure|cloud ?ops|tech ?ops|\bops engineer
    - operations engineer|it operations|systems? engineer|linux|\bunix\b|monitoring|telemetry
    - logging|data platform|streaming|database reliability|incident|\bnoc\b
    - kubernetes|\bk8s\b|admin(istrator)?\b|sysadmin|middleware|\bdba\b
    - release engineer|build engineer|automation engineer|ci/?cd|prometheus|grafana
    - (aws|azure|gcp) (engineer|architect)|resilience|capacity (engineer|planning)
    - chaos engineer|performance engineer
  # Rescue: a title that fails the prefilter is still kept when the description hits at least
  # `min_groups` of these signal groups (catches "Software Engineer, Core Services" that is
  # really Kafka/K8s operations work).
  desc_rescue_groups:
    - kafka|confluent|redpanda
    - elasticsearch|opensearch|\belk\b|logstash|kibana|splunk
    - prometheus|grafana|opentelemetry|datadog|new relic|observability|\bslo\b|error budget
    - kubernetes|\bk8s\b|helm\b
    - terraform|ansible|puppet|gitops|argocd
    - site reliability|\bsre\b|devops|on.?call|incident response|production support
    - ci/cd|jenkins|github actions
    - linux|unix
  min_groups: 3
  # Search terms for boards that only answer keyword queries (Workday, iCIMS, Phenom, Oracle HCM,
  # amazon.jobs). One request per term per board - keep the list short.
  search_terms:
    - site reliability engineer
    - devops
    - observability
    - platform engineer
    - kafka
    - elasticsearch
    - linux administrator
    - systems administrator
    - kubernetes

# One-click view on the Jobs page: home + home state + US remote, these role labels, direct boards, 30 days.
view:
  label: SRE view
  roles: [SRE]
  days: 30

role_titles:
  - {match: 'site reliability|\bsre\b|(systems?|service|application|platform|network|security|data) reliability engineer|production engineer', label: SRE, points: 30}
  - {match: 'observability',                               label: Observability,  points: 30}
  - {match: '\bkafka\b|streaming platform|event streaming',label: Kafka,          points: 30}
  - {match: 'elastic(search)?|\belk\b|opensearch',         label: Elastic,        points: 30}
  - {match: 'devops|dev ops',                              label: DevOps,         points: 28}
  - {match: 'platform (engineer|engineering|infrastructure|operations)', label: Platform, points: 27}
  - {match: 'reliability',                                 label: Reliability,    points: 25}
  - {match: 'infrastructure',                              label: Infra,          points: 24}
  - {match: 'monitoring|telemetry|logging',                label: Monitoring,     points: 24}
  - {match: 'cloud (engineer|operations|infrastructure)',  label: Cloud,          points: 22}
  - {match: 'database reliability|data platform',          label: DataPlatform,   points: 20}
  - {match: 'systems engineer|linux (engineer|admin)',     label: Systems,        points: 18}
  - {match: '\badmin(istrator)?\b|\bdba\b',                label: Admin,          points: 24}
  - {match: 'incident|noc\b',                              label: Incident,       points: 16}

title_blockers:
  - 'intern\b|internship|new grad|entry.level|\bjunior\b'
  - 'director|\bvp\b|vice president|head of|chief '
  - 'front.?end|mobile engineer|\bios\b|android|ui engineer|web developer'
  - '\bsales\b|marketing|recruiter|account (executive|manager)|customer success'
  # hardware / manufacturing "reliability" is not SRE
  - 'hardware reliability|product (quality )?(&|and )?reliability|equipment reliability|quality (&|and) reliability|solar cell|spacecraft|electrical engineer|mechanical engineer|manufacturing|reliability (test|technician|specialist)|supplier development|packaging reliability|power system engineer'
  - 'data scientist|\bml engineer\b|machine learning engineer'

title_penalties:
  - {match: 'manager', points: -10}     # keeps SRE-manager roles visible but lower
  - {match: '(java|c\+\+|rust|golang|scala|\bnode\b|backend|full.?stack) (engineer|developer)',
     points: -15}
  - {match: 'software (engineer|developer)',
     unless: 'sre|reliab|devops|platform|observab|monitoring|telemetry|\bops\b|\badmin|production|infra',
     points: -12}

seniority_bonus:
  - {match: 'senior|staff|principal|\blead\b|\bsr\.?\b', points: 6}

skills:
  cap_points: 40
  groups:
    - name: Elastic stack
      points: 9
      terms: [elasticsearch, elastic stack, elk, opensearch, logstash, kibana, beats, elastic cloud]
    - name: Kafka
      points: 9
      terms: [kafka, confluent, kafka connect, ksqldb, schema registry, msk, redpanda, kraft, event streaming]
    - name: Observability
      points: 6
      terms: [observability, prometheus, grafana, opentelemetry, otel, datadog, splunk, new relic, loki, jaeger, distributed tracing, slo, sli, error budget, pagerduty]
    - name: Platform & IaC
      points: 5
      terms: [kubernetes, k8s, terraform, ansible, helm, docker, argocd, gitops, ci/cd, jenkins, github actions, puppet, chef]
    - name: Cloud
      points: 4
      terms: [aws, gcp, google cloud, azure, eks, gke, ec2, s3, lambda]
    - name: Languages
      points: 3
      terms: [python, golang, bash, shell scripting]
    - name: Adjacent data infra
      points: 3
      terms: [redis, cassandra, rabbitmq, flink, spark, airflow, zookeeper, postgres, mysql, clickhouse]

freshness_bonus:
  - {within_days: 7,  points: 6}
  - {within_days: 14, points: 4}
  - {within_days: 30, points: 2}

source_points:
  direct: 3
  aggregator: 0

# Location classes come from Settings -> Home: home (your metro), home_state (other metros
# in your state), remote_us, remote_global, us_other (onsite elsewhere in the US), non_us.
location_points:
  home: 15
  home_state: 8
  remote_us: 12
  remote_global: 10
  us_other: -10
  non_us: -50
  unknown: 0

experience_bonus:
  - {match: '(8|9|10|12|15)\+?\s*(?:\+|plus)?\s*years', points: 4}

flags:
  citizenship:
    points: -60
    label: "Citizenship/clearance required"
    terms: [security clearance, ts/sci, top secret, us citizenship required, u.s. citizenship required,
            must be a us citizen, must be a u.s. citizen, citizenship is required, polygraph, public trust clearance]
    patterns:
      - '\bbe (?:an? )?(?:us|u\.s\.|united states) (?:citizens?|persons?)\b'
      - '\b(?:us|u\.s\.) citizens? only\b'
      - '\bonly (?:us|u\.s\.) citizens\b'
      - '\bwho are (?:us|u\.s\.) citizens\b'
      - '\b(?:us|u\.s\.) citizen(?:s|ship)? (?:or|and|/) (?:(?:us|u\.s\.) )?(?:green card|permanent resident|lawful permanent)'
    ignore: [polygraph protection act, eppa]
  itar:
    points: -40
    label: "ITAR / US-persons restriction"
    terms: [itar, u.s. person, us persons]
  export_notice:
    points: -3
    label: "Export-control notice"
    terms: [export control, export administration regulations, deemed export]
  no_sponsorship:
    # For a candidate who needs no sponsorship this is a small note, not a rejection.
    points: -3
    label: "Says no sponsorship (OK if you need none)"
    terms: [no sponsorship, unable to sponsor, not able to sponsor, cannot sponsor, will not sponsor,
            without sponsorship, sponsorship is not available, not offer sponsorship]
  contract:
    points: 0
    label: "Contract role"
    terms: [contract position, contract role, c2c, corp to corp, corp-to-corp, "1099", w2 contract, contract-to-hire, contract to hire]

# Starting judgement rules for model fit scoring (copied into resume/fit-profile.md on first use;
# the file then learns from your thumbs and is never overwritten by a preset).
fit_profile_default: |
  # Fit profile - judgement rules for scoring jobs (maintained by fit.py, editable)

  Scores are 0-100: how well I could do THIS job on day one AND get hired for it.

  ## Role fit
  - Core match (80-95): SRE, DevOps, platform engineering, observability, cloud infrastructure,
    ELK/Kafka platform administration, production/operations engineering.
  - Adjacent (55-75): systems engineering, cloud operations, release/build engineering,
    infrastructure-flavoured software roles where operating the platform is most of the job.
  - Specialist roles (35-65): a role that is really about ONE technology's internals (database
    engine internals, network fabric, a vendor product) scores on my depth in that technology,
    not on SRE generalism. Broad distributed-systems and relational-database concepts are NOT
    the same as single-engine internals expertise.
  - Product development (20-45): writing the product itself (backend/full-stack/data
    engineering/ML) unless operations is explicitly the larger half.

  ## Seniority
  - Senior / Staff / Lead IC titles are fine. Manager titles: lower unless hands-on.

  ## Depth calibration
  - See the skills inventory for levels. "familiar" means I can work with it with ramp-up,
    not that I can be the expert.

  ## Learned adjustments
  (none yet - feedback from the Jobs page lands here)
